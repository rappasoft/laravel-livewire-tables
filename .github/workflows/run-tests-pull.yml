name: Run Tests Pull

on:
  pull_request:
    branches:
      - 'development'
      - 'master'

jobs:
  test-laravel10:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest]
        php: [8.1, 8.2, 8.3]
        laravel: [10.*]
        stability: [prefer-dist]

    name: PULL PHP-${{ matrix.php }} - Laravel-10
    env:
      extensionKey: phpextensions-${{ matrix.os }}-P${{ matrix.php }}
      extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo, :psr

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Setup cache environment
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.extensions }}
          key: ${{ env.extensionKey }}

      - name: Cache extensions
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ matrix.os }}-${{ steps.extcache.outputs.key }}
          restore-keys: ${{ matrix.os }}-${{ steps.extcache.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.extensions }}
          ini-values: memory_limit=512M
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: Get composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ matrix.os }}-PHP${{ matrix.php }}-L${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ matrix.os }}-PHP${{ matrix.php }}-L${{ matrix.laravel }}-composer-

      - name: Add token
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          composer config github-oauth.github.com $GITHUB_TOKEN
          
      - name: Allow verified upstream advisories for legacy compatibility tests
        if: matrix.laravel == '10.*' || matrix.laravel == '11.*' || matrix.laravel == 11
        run: composer config --json policy.advisories.ignore-id '{"PKSA-d5tc-s1qs-h781":"Legacy Laravel 10/11 compatibility tests only; production apps must use patched Laravel 12.69+ or 13.30+.","PKSA-m5cs-t1y6-qpcs":"Legacy Laravel 10/11 compatibility tests only; production apps must use patched Laravel 12.69+ or 13.30+.","PKSA-3r5d-mb8f-1qw9":"Legacy Laravel 10/11 compatibility tests only; production apps must use patched Laravel 12.69+ or 13.30+.","PKSA-mdq4-51ck-6kdq":"Legacy Laravel 10/11 compatibility tests only; production apps must use patched Laravel 12.69+ or 13.30+."}'

      - name: Install dependencies
        run: composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update

      - name: Update dependencies
        run: composer update --${{ matrix.stability }} --no-interaction

      - name: Audit dependencies
        run: composer audit

      - name: Setup problem matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run Unit Tests
        run: php ./vendor/bin/paratest --testsuite "Laravel Livewire Tables Unit Test Suite" --no-coverage

      - name: Run Visuals Tests
        run: php ./vendor/bin/phpunit --testsuite "Laravel Livewire Tables Visuals Test Suite" --no-coverage

